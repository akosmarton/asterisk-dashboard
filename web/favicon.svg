<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Asterisk symbol (*) -->
  <g fill="#38bdf8" filter="url(#glow)">
    <!-- Vertical beam -->
    <rect x="28.5" y="14" width="7" height="36" rx="3.5"/>
    <!-- Diagonal beam 1 (60 deg) -->
    <rect x="28.5" y="14" width="7" height="36" rx="3.5" transform="rotate(60 32 32)"/>
    <!-- Diagonal beam 2 (120 deg) -->
    <rect x="28.5" y="14" width="7" height="36" rx="3.5" transform="rotate(120 32 32)"/>
    <!-- Center core dot -->
    <circle cx="32" cy="32" r="6" fill="#f8fafc"/>
  </g>
</svg>
